# 1. 這個 Action 的名稱（會在 GitHub 畫面上顯示）
name: Node.js Continuous Integration

# 2. 觸發條件：什麼時候要執行這個自動化流程？
on:
  push:
    branches: [ "main", "develop" ] # 當有人 push 到 main 或 develop 分支時觸發
  pull_request:
    branches: [ "main", "develop" ] # 當有人對 main 或 develop 分支發起 PR 時觸發

# 3. 具體要執行的任務 (Jobs)
jobs:
  test-project: # 任務名稱，可自訂
    runs-on: ubuntu-latest # 使用 GitHub 提供的最新版 Ubuntu 虛擬機來跑測試

    steps:
    # 步驟 A：把你的程式碼從 GitHub 複製（Checkout）到虛擬機上
    - name: Checkout repository
      uses: actions/checkout@v4

    # 步驟 B：安裝 Node.js 環境
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # 指定使用的 Node.js 版本
        cache: 'npm'       # 快取 npm 套件，讓下次執行更快

    # 步驟 C：安裝專案所需的相依套件
    - name: Install dependencies
      run: npm ci          # 相當於更嚴格乾淨的 npm install

    # 步驟 D：執行測試程序（核心重點！）
    - name: Run automated tests
      run: npm test        # 執行你在 package.json 裡設定的測試指令
